<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-label="Block diagram of the supply-locked ring-oscillator temperature sensor">

<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
  </marker>
  <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/>
  </marker>
</defs>
<rect width="800" height="440" rx="16" fill="#f8fafc"/>
<text x="24" y="34" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">Reference-free supply-locked RO temperature sensor</text>
<text x="24" y="54" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#64748b">no crystal · no bandgap · standard cells only</text>

<!-- shared supply node -->
<rect x="250" y="88" width="14" height="230" rx="7" fill="#e9d5ff" stroke="#7c3aed" stroke-width="1.5"/>
<text x="257" y="80" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#7c3aed">V_DD,shared</text>

<rect x="40" y="150" width="170" height="84" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="125.0" y="190.0" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Supply regulator</text>
<text x="125.0" y="209.0" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">DAC + LDO (digital-assisted)</text>
<line x1="210" y1="192" x2="250" y2="192" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

<rect x="300" y="100" width="190" height="76" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="395.0" y="136.0" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f172a">LVT ring oscillator</text>
<text x="395.0" y="155.0" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">2-stack, custom std-cell reference</text>
<rect x="300" y="230" width="190" height="76" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="395.0" y="266.0" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f172a">HVT ring oscillator</text>
<text x="395.0" y="285.0" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">same supply, different V_TH</text>
<line x1="264" y1="138" x2="300" y2="138" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>
<line x1="264" y1="268" x2="300" y2="268" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

<rect x="540" y="100" width="130" height="76" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="605.0" y="136.0" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Counter /</text>
<text x="605.0" y="155.0" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">frequency detector</text>
<line x1="490" y1="138" x2="540" y2="138" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><text x="515.0" y="130.0" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">f_LVT</text>
<rect x="540" y="230" width="130" height="76" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
<text x="605.0" y="266.0" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f172a">Ratio</text>
<text x="605.0" y="285.0" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">f_HVT / f_LVT</text>
<line x1="490" y1="268" x2="540" y2="268" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/><text x="515.0" y="260.0" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">f_HVT</text>
<line x1="605" y1="176" x2="605" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

<rect x="690" y="230" width="90" height="76" rx="10" fill="#ecfeff" stroke="#0e7490" stroke-width="1.8"/>
<text x="735.0" y="266.0" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0f172a">T code</text>
<text x="735.0" y="285.0" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#475569">±0.1 °C target</text>
<line x1="670" y1="268" x2="690" y2="268" stroke="#334155" stroke-width="2" marker-end="url(#arr)"/>

<!-- feedback loop -->
<path d="M605,100 L605,60 L125,60 L125,150" fill="none" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrp)"/><text x="365" y="52" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#7c3aed">digital loop filter · PLL-based feedback</text>
<rect x="330" y="360" width="300" height="46" rx="10" fill="#fff" stroke="#cbd5e1"/>
<text x="480" y="379" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">Loop locks the LVT RO by adjusting V_DD,shared;</text>
<text x="480" y="396" text-anchor="middle" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#334155">HVT/LVT frequency ratio then depends on temperature only.</text>
<text x="24" y="420" font-family="Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#94a3b8">Samsung 14nm FinFET · GDS Nov. 2026</text>
</svg>
