    <g transform="translate(400.0,350.0)" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">

<rect x="-160" y="-100" width="320" height="170" rx="14"/>
<path d="M-120,-40 l40,40 l40,-60 l40,50 l60,-70" stroke="#fde68a" stroke-width="8"/>
