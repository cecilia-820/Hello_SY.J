- title: Current Research — M.S. Thesis
  type: time_table
  contents:
    - title: Reference-Free Supply-Locked Ring-Oscillator Temperature Sensor (main research)
      institution: KAIST, Daejeon, Korea
      year: 2025 – present
      description:
        - Target ±0.1 °C inaccuracy over −40 to 125 °C; power and area to be reported after measurement.
        - Designed a custom standard-cell-based 2-stack LVT ring oscillator as the reference clock. A PLL-based feedback loop maintains a constant shared supply voltage for the LVT and HVT ring oscillators, and temperature is measured from their frequency ratio.
        - Performed end-to-end analog and digital IC design, from transistor-level design to DRC/LVS-clean layout and system-level loop/noise analysis.
        - title: Samsung 14nm FinFET tape-out in progress (GDS Nov. 2026); first-author paper in preparation (ISSCC 2028).
          contents:
            - "Cadence flow: Genus, Innovus, Xcelium, SimVision, Tempus, Voltus, Pegasus"
    - title: Research Plugin and Skills for Circuit-Paper Analysis (sub-project)
      institution: KAIST, Daejeon, Korea
      year: 2026 – present
      description:
        - Participating in the development of a lab-wide Codex research plugin for paper discovery, structured analysis, evidence extraction and research-workspace management.
        - Responsible for the RAG and retrieval component, using keyword, semantic, schematic-topology, functional and behavioral representations to retrieve related circuit techniques across different figures and terminology.

