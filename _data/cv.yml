- title: Project Experience
  type: time_table
  contents:
    - title: COSS Next-Generation Semiconductor MCU Application Competition — Team Leader
      institution: Microcontroller Application Competition, Seoul National University (POLARIS)
      year: Nov. 2024
      description:
        - Built a bare-metal embedded 34-key digital piano; flashed firmware directly via USBasp.
        - Stored LED control data in flash using PROGMEM, enabling updates for 486 NeoPixels per timer interval, over 10× more than other teams, while maintaining simultaneous animation and piano playback under tight MCU memory constraints.
        - Won the Minister of Education Award; received the Achievement Award at Hanyang's Foundation Day Ceremony.
    - title: Low-Cost Eye-Drawing Platform Using MCU-Based Electrooculography (EOG) — Team Leader
      institution: Hanyang Academic Conference, Hanyang University
      year: May – Nov. 2024
      description:
        - Designed and built the analog front end for EOG measurement and a MATLAB algorithm mapping EOG signals to drawing movements.
        - Won the Grand Award (Hanyang Academic Conference) and the Best Question Award (ASKTON) from the University President.
    - title: EMG-Based Prosthetic Arm Using MCU — Team Leader
      institution: Term Project, Digital Engineering Course, Hanyang University
      year: Apr. – Jun. 2024
      description:
        - Filtered and feature-extracted EMG/EOG signals on an ATmega128 and mapped them to prosthetic-limb movements.

